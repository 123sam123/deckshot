<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>DECKSHOT</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05080d;
        color: #e6edf3;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
        /* Explicit 100% is required: <canvas> is a replaced element, so
           `inset: 0` alone leaves it at its intrinsic 300x150. */
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* Deliberately NO `#ui > * { pointer-events: auto }` here. `#ui > *`
         is an ID selector (1,0,0) and beats `.ds-root` (0,1,0), so it used to
         override the React root's own `pointer-events: none` and cover the
         whole viewport with a click-catcher. That silently ate every click on
         the canvas, and clicking the canvas is what requests pointer lock — so
         the game could only ever be controlled if the one requestPointerLock()
         fired from the spawn handler happened to be granted, with no way to
         recover if it was not. Each UI layer sets its own pointer-events in
         `ui/styles.ts` (.ds-screen and .ds-overlay opt in, .ds-hud stays out). */
      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
